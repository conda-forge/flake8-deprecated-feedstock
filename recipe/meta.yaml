{% set name = "flake8-deprecated" %}
{% set version = "2.4.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/flake8_deprecated-{{ version }}.tar.gz
  sha256: 2c6d7b3cce6956d0e7a787bdc0a52ba71e62ece4c07084b73d5f5e3b7715cbfa

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - hatchling
    - pip
  run:
    - python >={{ python_min }}
    - flake8

test:
  imports:
    - flake8_deprecated
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  summary: Warns about deprecated method calls
  home: https://github.com/gforcada/flake8-deprecated
  license: GPL-2.0-only
  license_file: LICENSE

extra:
  recipe-maintainers:
    - traversaro
